<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Benchmark Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <div class="bg-white rounded-lg shadow-md p-8 w-full max-w-sm">
    <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">Benchmark Platform</h1>
    <form method="POST" action="/web/login">
      <label class="block text-sm font-medium text-gray-700 mb-2" for="token">Agent Token</label>
      <input
        type="password"
        id="token"
        name="token"
        placeholder="Enter your token"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        autofocus
        required
      >
      {% if error %}
      <p class="mt-2 text-sm text-red-600">{{ error }}</p>
      {% endif %}
      <button
        type="submit"
        class="mt-4 w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition-colors"
      >
        Login
      </button>
    </form>
    <p class="mt-4 text-xs text-center text-gray-400">Admin: use default team token &middot; Observer: use team token</p>
  </div>
</body>
</html>
