<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scoreboard - Benchmark Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <header class="bg-white shadow-sm border-b">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <h1 class="text-xl font-bold text-gray-800">Benchmark Scoreboard</h1>
      <div class="flex items-center gap-4">
        <span class="text-sm text-gray-500">{{ user.get('team_name', '') }}</span>
        <a href="/web/logout" class="text-sm text-red-500 hover:text-red-700">Logout</a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8"
        hx-get="/web/scoreboard"
        hx-trigger="every 30s"
        hx-select="#scoreboard-table"
        hx-target="#scoreboard-table"
        hx-swap="outerHTML">
    <div id="scoreboard-table">
      <table class="w-full bg-white rounded-lg shadow overflow-hidden">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Team</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Solved Flags</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Progress</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-200">
          {% for team in teams %}
          <tr>
            <td class="px-6 py-4 text-sm font-medium text-gray-900">{{ team.name }}</td>
            <td class="px-6 py-4 text-sm text-gray-600">{{ team.solved_flags }}</td>
            <td class="px-6 py-4">
              <div class="w-full bg-gray-200 rounded-full h-2">
                <div class="bg-blue-600 h-2 rounded-full" style="width: {{ [team.solved_flags / total_flags * 100, 100] | min }}%"></div>
              </div>
            </td>
          </tr>
          {% endfor %}
          {% if not teams %}
          <tr>
            <td colspan="3" class="px-6 py-8 text-center text-gray-400">No teams yet</td>
          </tr>
          {% endif %}
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
