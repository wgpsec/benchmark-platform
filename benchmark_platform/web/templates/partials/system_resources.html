<div class="grid grid-cols-3 gap-4">
  <div class="bg-white rounded-xl border border-gray-100 p-4 relative overflow-hidden">
    <div class="absolute top-0 right-0 w-16 h-16 bg-gradient-to-bl from-blue-50 to-transparent rounded-bl-full"></div>
    <div class="flex items-center gap-2.5 mb-2">
      <div class="w-8 h-8 rounded-lg bg-blue-50 flex items-center justify-center">
        <svg class="w-4 h-4 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 3v1.5M4.5 8.25H3m18 0h-1.5M4.5 12H3m18 0h-1.5m-15 3.75H3m18 0h-1.5M8.25 19.5V21M12 3v1.5m0 15V21m3.75-18v1.5m0 15V21m-9-1.5h10.5a2.25 2.25 0 002.25-2.25V6.75a2.25 2.25 0 00-2.25-2.25H6.75A2.25 2.25 0 004.5 6.75v10.5a2.25 2.25 0 002.25 2.25z" /></svg>
      </div>
      <span class="text-[11px] font-medium text-gray-400 uppercase">CPU</span>
    </div>
    <div class="text-[24px] font-bold text-gray-900">{{ cpu_percent }}%</div>
    <div class="mt-2 h-2 bg-gray-100 rounded-full overflow-hidden">
      <div class="h-full rounded-full transition-all {% if cpu_percent > 80 %}bg-gradient-to-r from-red-400 to-red-500{% elif cpu_percent > 60 %}bg-gradient-to-r from-amber-400 to-amber-500{% else %}bg-gradient-to-r from-emerald-400 to-emerald-500{% endif %}" style="width: {{ cpu_percent }}%"></div>
    </div>
  </div>
  <div class="bg-white rounded-xl border border-gray-100 p-4 relative overflow-hidden">
    <div class="absolute top-0 right-0 w-16 h-16 bg-gradient-to-bl from-amber-50 to-transparent rounded-bl-full"></div>
    <div class="flex items-center gap-2.5 mb-2">
      <div class="w-8 h-8 rounded-lg bg-amber-50 flex items-center justify-center">
        <svg class="w-4 h-4 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 6.878V6a2.25 2.25 0 012.25-2.25h7.5A2.25 2.25 0 0118 6v.878m-12 0c.235-.083.487-.128.75-.128h10.5c.263 0 .515.045.75.128m-12 0A2.25 2.25 0 004.5 9v.878m13.5-3A2.25 2.25 0 0119.5 9v.878m0 0a2.246 2.246 0 00-.75-.128H5.25c-.263 0-.515.045-.75.128m15 0A2.25 2.25 0 0121 12v6a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 18v-6c0-1.007.661-1.862 1.573-2.149" /></svg>
      </div>
      <span class="text-[11px] font-medium text-gray-400 uppercase">Memory</span>
    </div>
    <div class="text-[24px] font-bold text-gray-900">{{ mem_percent }}%</div>
    <div class="text-[11px] text-gray-400 mt-0.5">{{ mem_used_gb }} / {{ mem_total_gb }} GB</div>
    <div class="mt-2 h-2 bg-gray-100 rounded-full overflow-hidden">
      <div class="h-full rounded-full transition-all {% if mem_percent > 80 %}bg-gradient-to-r from-red-400 to-red-500{% elif mem_percent > 60 %}bg-gradient-to-r from-amber-400 to-amber-500{% else %}bg-gradient-to-r from-emerald-400 to-emerald-500{% endif %}" style="width: {{ mem_percent }}%"></div>
    </div>
  </div>
  <div class="bg-white rounded-xl border border-gray-100 p-4 relative overflow-hidden">
    <div class="absolute top-0 right-0 w-16 h-16 bg-gradient-to-bl from-gray-50 to-transparent rounded-bl-full"></div>
    <div class="flex items-center gap-2.5 mb-2">
      <div class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center">
        <svg class="w-4 h-4 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M20.25 6.375c0 2.278-3.694 4.125-8.25 4.125S3.75 8.653 3.75 6.375m16.5 0c0-2.278-3.694-4.125-8.25-4.125S3.75 4.097 3.75 6.375m16.5 0v11.25c0 2.278-3.694 4.125-8.25 4.125s-8.25-1.847-8.25-4.125V6.375m16.5 0v3.75m-16.5-3.75v3.75m16.5 0v3.75C20.25 16.153 16.556 18 12 18s-8.25-1.847-8.25-4.125v-3.75m16.5 0c0 2.278-3.694 4.125-8.25 4.125s-8.25-1.847-8.25-4.125" /></svg>
      </div>
      <span class="text-[11px] font-medium text-gray-400 uppercase">Disk</span>
    </div>
    <div class="text-[24px] font-bold text-gray-900">{{ disk_percent }}%</div>
    <div class="text-[11px] text-gray-400 mt-0.5">{{ disk_used_gb }} / {{ disk_total_gb }} GB</div>
    <div class="mt-2 h-2 bg-gray-100 rounded-full overflow-hidden">
      <div class="h-full rounded-full transition-all {% if disk_percent > 80 %}bg-gradient-to-r from-red-400 to-red-500{% elif disk_percent > 60 %}bg-gradient-to-r from-amber-400 to-amber-500{% else %}bg-gradient-to-r from-emerald-400 to-emerald-500{% endif %}" style="width: {{ disk_percent }}%"></div>
    </div>
  </div>
</div>
