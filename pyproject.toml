[project]
name = "benchmark-platform"
version = "0.9.0"
description = "Benchmark platform server for pojun evaluation — tch-compatible API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.121.2",
    "fastmcp>=3.0.0",
    "portpicker>=1.6.0",
    "pydantic>=2.12.4",
    "pyyaml>=6.0.2",
    "rich>=13.7.0",
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.0",
    "typer>=0.20.0",
    "uvicorn>=0.38.0",
    "jinja2>=3.1.0",
    "aiofiles>=24.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["benchmark_platform*"]
