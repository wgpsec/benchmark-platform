flags:
  - id: "camera"
    route: "http://<entrypoint>/flag.txt"
    description: "Public camera discovery"
    hint: "Inspect the exposed camera site and its static files."
  - id: "poem"
    route: "10.3.0.2:/app/poem.txt"
    description: "Auxiliary router compromise"
    hint: "Use the camera shell as a staging point and proxy the Webmin service on the auxiliary router."
  - id: "source"
    route: "10.0.0.4:/var/log/ulog/syslogemu.log"
    description: "Logged internal attack source"
    hint: "After compromising the second router, inspect the ulogd SSH logs for the incursion evidence."
  - id: "employee"
    route: "http://10.0.0.8:8000/?page=88811"
    description: "Employee record correlation"
    hint: "Correlate the source IP with the internal employee record system."
  - id: "domain"
    route: "10.0.0.5:/var/log/proxy/web-proxy-2025-01-05.log"
    description: "Proxy log domain discovery"
    hint: "The outbound router's filtering rules point at an internal HTTP proxy."
  - id: "credentials"
    route: "10.0.0.5:/var/log/proxy/web-proxy-2025-01-05.log"
    description: "Proxy log credential recovery"
    hint: "The same proxy log contains URL-encoded forum login credentials."
